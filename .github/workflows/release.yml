name: Release & Package Build

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version (if bump_type is custom, e.g. 2.2.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows Distribution & Release
    runs-on: windows-latest
    # The version-bump commit is pushed with GITHUB_TOKEN and does not re-trigger
    # workflows. This guard protects against PAT-based pushes that would.
    if: ${{ !startsWith(github.event.head_commit.message, 'Bump version') }}

    env:
      BUILD_GRADLE_PATH: composeApp/build.gradle.kts
      BUILD_CONFIG_PATH: composeApp/src/desktopMain/kotlin/com/velocity/kmpwinget/core/BuildConfig.kt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          $content = Get-Content $env:BUILD_GRADLE_PATH -Raw
          if ($content -match 'version\s*=\s*"([^"]+)"') {
              $currentVersion = $matches[1]
          } else {
              throw "Unable to read the current version from $env:BUILD_GRADLE_PATH"
          }
          Write-Host "Current version: $currentVersion"

          $isTagPush = $env:GITHUB_REF -like 'refs/tags/*'
          if ($isTagPush) {
              $newVersion = $env:GITHUB_REF_NAME.TrimStart('v')
              $shouldCommit = 'false'
          } else {
              $bumpType = "${{ github.event.inputs.bump_type }}"
              $customVersion = "${{ github.event.inputs.custom_version }}"

              if ($bumpType -eq 'custom' -and $customVersion -ne '') {
                  $newVersion = $customVersion.TrimStart('v')
              } elseif ($bumpType -in @('major', 'minor', 'patch')) {
                  $parts = $currentVersion.Split('.')
                  $major = [int]$parts[0]
                  $minor = if ($parts.Length -gt 1) { [int]$parts[1] } else { 0 }
                  $patch = if ($parts.Length -gt 2) { [int]$parts[2] } else { 0 }

                  switch ($bumpType) {
                      'major' { $major++; $minor = 0; $patch = 0 }
                      'minor' { $minor++; $patch = 0 }
                      default { $patch++ }
                  }
                  $newVersion = "$major.$minor.$patch"
              } else {
                  # Automatic bump for a merge/push to main, derived from the
                  # conventional prefixes used by the project's commit messages.
                  $previousTag = git describe --tags --abbrev=0 2>$null
                  $range = if ($previousTag) { "$previousTag..HEAD" } else { 'HEAD' }
                  $messages = git log $range --pretty=format:"%s"

                  $parts = $currentVersion.Split('.')
                  $major = [int]$parts[0]
                  $minor = if ($parts.Length -gt 1) { [int]$parts[1] } else { 0 }
                  $patch = if ($parts.Length -gt 2) { [int]$parts[2] } else { 0 }

                  $breaking = $messages | Where-Object {
                      $_ -match '^[a-zA-Z]+(\(.+\))?!:' -or $_ -match 'BREAKING[ -]CHANGE'
                  }
                  $features = $messages | Where-Object {
                      $_ -match '^(Add|Implement|Support|Create|Introduce)\b' -or
                      $_ -match '^feat(\(.+\))?:'
                  }

                  if ($breaking) {
                      $major++; $minor = 0; $patch = 0
                  } elseif ($features) {
                      $minor++; $patch = 0
                  } else {
                      $patch++
                  }
                  $newVersion = "$major.$minor.$patch"
              }

              $shouldCommit = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'true' } else { 'false' }
          }

          Write-Host "New version: $newVersion"
          "NEW_VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHOULD_COMMIT=$shouldCommit" | Out-File -FilePath $env:GITHUB_ENV -Append

          (Get-Content $env:BUILD_GRADLE_PATH) -replace 'version\s*=\s*"[^"]+"', "version = `"$newVersion`"" |
              Set-Content $env:BUILD_GRADLE_PATH -Encoding utf8
          (Get-Content $env:BUILD_CONFIG_PATH) -replace 'const val APP_VERSION\s*=\s*"[^"]+"', "const val APP_VERSION = `"$newVersion`"" |
              Set-Content $env:BUILD_CONFIG_PATH -Encoding utf8

      - name: Commit Version Bump
        if: env.SHOULD_COMMIT == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $env:BUILD_GRADLE_PATH $env:BUILD_CONFIG_PATH

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Version files already up to date; nothing to commit."
          } else {
              git commit -m "Bump version to $env:NEW_VERSION"
              git push origin HEAD:main
          }

          "RELEASE_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Capture Release SHA
        if: env.SHOULD_COMMIT != 'true'
        shell: pwsh
        run: |
          "RELEASE_SHA=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows Installers (.msi & .exe)
        run: ./gradlew packageDistributionForCurrentOS --no-daemon

      - name: Generate Checksums & Changelog
        id: changelog
        shell: pwsh
        run: |
          $newVersion = $env:NEW_VERSION
          $msiPath = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi" -Filter "*.msi" | Select-Object -First 1
          $exePath = Get-ChildItem -Path "composeApp/build/compose/binaries/main/exe" -Filter "*.exe" | Select-Object -First 1

          $msiName = if ($msiPath) { $msiPath.Name } else { 'N/A' }
          $exeName = if ($exePath) { $exePath.Name } else { 'N/A' }
          $msiHash = if ($msiPath) { (Get-FileHash -Path $msiPath.FullName -Algorithm SHA256).Hash } else { 'N/A' }
          $exeHash = if ($exePath) { (Get-FileHash -Path $exePath.FullName -Algorithm SHA256).Hash } else { 'N/A' }

          $tags = @(git tag --sort=-v:refname)
          $previousTag = $tags | Where-Object { $_ -ne $env:TAG_NAME } | Select-Object -First 1
          $range = if ($previousTag) { "$previousTag..HEAD" } else { 'HEAD' }
          $rawCommits = git log $range --pretty=format:"%s"

          $features = @()
          $improvements = @()
          $fixes = @()

          foreach ($msg in ($rawCommits -split "`n")) {
              $clean = $msg.Trim()
              if ($clean -eq '' -or $clean -match '^Bump version\b' -or $clean -match '^Merge (branch|pull request)\b') {
                  continue
              }

              if ($clean -match '^(Add|Implement|Support|Create|Introduce)\b' -or $clean -match '^feat(\(.+\))?:') {
                  $features += "- ✨ $clean"
              } elseif ($clean -match '^(Fix|Resolve|Correct)\b' -or $clean -match '^fix(\(.+\))?:') {
                  $fixes += "- 🐛 $clean"
              } elseif ($clean -match '^(Update|Upgrade|Refactor|Enhance|Improve|Clean|Optimize|Modernize|Rename|Move|Replace|Remove|Bump|Migrate)\b' -or
                        $clean -match '^(refactor|perf|chore|build|ci|style|test)(\(.+\))?:') {
                  $improvements += "- ⚡ $clean"
              } else {
                  $improvements += "- 🔹 $clean"
              }
          }

          $lines = @('## What''s Changed', '')
          if ($features.Count -gt 0) { $lines += $features }
          if ($improvements.Count -gt 0) { $lines += $improvements }
          if ($fixes.Count -gt 0) { $lines += $fixes }
          if ($features.Count + $improvements.Count + $fixes.Count -eq 0) {
              $lines += '- 🔹 Maintenance release.'
          }

          $lines += @(
              '',
              '### 📦 Installation Packages (SHA-256)',
              '',
              '| Package | Format | SHA-256 Checksum |',
              '| :--- | :--- | :--- |',
              "| **$msiName** | Windows Installer (``.msi``) | ``$msiHash`` |",
              "| **$exeName** | Executable Installer (``.exe``) | ``$exeHash`` |",
              '',
              '---',
              '*Built automatically with GitHub Actions.*'
          )

          $lines | Out-File -FilePath "RELEASE_NOTES.md" -Encoding utf8
          Get-Content "RELEASE_NOTES.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Release ${{ env.NEW_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          draft: false
          prerelease: false
